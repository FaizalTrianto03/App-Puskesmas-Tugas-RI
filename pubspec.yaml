name: app_puskesmas_tugas_ri
description: "A new Flutter project."
publish_to: 'none'

version: 4.7.6+9

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  intl: ^0.19.0
  
  # Firebase - bump to newer major versions compatible with newer AndroidX / compileSdk
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_functions: ^5.0.0
  flutter_dotenv: ^5.1.0

  # Local Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Animation
  animate_do: ^3.3.4
  lottie: ^3.1.2

  # Icons
  flutter_svg: ^2.0.10+1

  # Storage
  shared_preferences: ^2.2.3
  get_storage: ^2.1.1

  # UI
  google_fonts: ^6.2.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/fonts/
    - assets/audio/
